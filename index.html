<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비너스 그룹 신성인자 진단 시스템</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-width: 450px;
            width: 100%;
            text-align: center;
            border: 1px solid #333;
        }
        h1 {
            font-size: 1.4rem;
            color: #d1d5db;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
        }
        .result-box {
            background-color: #2a2a2a;
            border-left: 4px solid #f59e0b;
            padding: 20px;
            border-radius: 6px;
            text-align: left;
            margin-bottom: 25px;
            min-height: 160px;
        }
        .label {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 4px;
        }
        .value {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 12px;
        }
        .tag {
            display: inline-block;
            font-size: 0.75rem;
            background-color: #374151;
            color: #f59e0b;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 6px;
            vertical-align: middle;
        }
        .desc {
            font-size: 0.95rem;
            color: #d1d5db;
            line-height: 1.5;
        }
        button {
            background-color: #f59e0b;
            color: #121212;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        button:hover {
            background-color: #d97706;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏛️ 비너스 그룹 인자 진단 시스템</h1>
    
    <div class="result-box">
        <div class="label">신성인자</div>
        <div class="value"><span id="deity">버튼을 눌러 진단하세요</span><span id="group-tag" class="tag" style="display:none;"></span></div>
        
        <div class="label">인자 능력</div>
        <div class="value" id="ability">-</div>
        
        <div class="label">주요 특징</div>
        <div class="desc" id="feature">-</div>
    </div>

    <button onclick="generateData()">인자 측정하기</button>
</div>

<script>
    // 6개의 속성 그룹별 데이터 정의
    const groups = [

            abilities: [
                "모든 기술 체계 및 사물 구조 정밀 통찰형 인자",
                "초감각적 공간·구조 인지 및 정밀 제어형 인자",
                "직관적 결함 감지 및 과부하 내성형 인자",
                "신체 병목 및 이상 증상 즉각 진단형 인자",
                "미세한 사각지대를 감지하는 감각 확장형 인자"
            ],
            features: [
                "시스템이나 물건의 미세한 구조적 균열을 즉시 파악해 냄.",
                "방대한 도면이나 데이터를 보는 즉시 입체적 청사진으로 재구성함.",
                "남들이 보지 못하는 치명적 시스템 결함을 동물적으로 감지함.",
                "상대방의 신체 이상이나 인자 오작동 원인을 즉시 진단해 냄.",
                "직관적으로 시스템의 숨겨진 백도어나 오류 위치를 찾아냄."
            ]
        },
        {
            name: "매혹·신호계",
            deities: ["아프로디테 (Aphrodite)", "헤르메스 (Hermes)", "디오니소스 (Dionysus)", "에로스 (Eros)", "에코 (Echo)"],
            abilities: [
                "타인 감각 지배 및 최상위 페로몬 유도형 인자",
                "신체 신경 가속 및 파동·신호 감응형 인자",
                "신경계 자율 자극 및 감각 증폭형 인자",
                "특정 대상에게 감정적 애착을 유도하는 페로몬형 인자",
                "상대의 음성을 그대로 복사해 재현하는 음성형 인자"
            ],
            features: [
                "특유의 치명적인 체향으로 타인의 감정을 순간적으로 동요시킴.",
                "상대방의 미세한 두근거림이나 심장박동을 피부 감각으로 읽음.",
                "타인의 감각을 마비시키거나 순간적으로 극도의 흥분 상태로 몰아넣음.",
                "상대에게 정서적 안도감과 극도의 애착을 형성하게 만듦.",
                "들었던 소리나 데이터 파형을 그대로 기억하여 완벽히 재현함."
            ]
        },
        {
            name: "전투·신체계",
            deities: ["제우스 (Zeus)", "아레스 (Ares)", "헤라클레스 (Heracles)", "아틀라스 (Atlas)", "니케 (Nike)"],
            abilities: [
                "전자기파 직관 및 신체 반응 가속형 인자",
                "신체 아드레날린 및 근육 파괴 내성 극대화형 인자",
                "신체 한계 수치 일시적 도핑형 인자",
                "신체 고중량 압박 견딤 및 하중 분산형 인자",

            ],
            features: [
                "찰나의 순간에 고전압 전자기파와 유사한 반응 속도를 끌어올림.",
                "위기 상황일수록 고통을 잊고 폭발적인 피지컬을 발휘함.",
                "순간적인 신체 오버클럭을 통해 한계를 뛰어넘는 힘을 냄.",
                "상당한 신체적 과부하와 물리적 압박에도 동요 없이 견뎌냄.",
                "경쟁 상황에서 승리 가능성이 가장 높은 선택지를 직관적으로 파악함."
            ]
        },
        {
            name: "은밀·감각계",
            deities: ["아르테미스 (Artemis)", "하데스 (Hades)", "판 (Pan)", "다프네 (Daphne)", "시린크스 (Syrinx)"],
            abilities: [
                "동체시력 및 원거리 신체 직관 강화형 인자",
                "신체 은폐 및 시각 인식 차단형 인자",
                "초음파 및 미세 음파 감지형 인자",
                "타인의 시선을 신체적으로 회피하는 본능형 인자",
                "미세한 공기 흐름을 신체로 읽어내는 감응형 인자"
            ],
            features: [
                "어두운 곳이나 복잡한 구조 속에서도 정밀한 목표물을 타격함.",

                "미세한 소리나 진동의 원인지를 직관적으로 찾아냄.",
                "자신에게 쏠리는 타인의 위압적 시선을 자연스럽게 튕겨냄.",
                "공기의 미세한 유동을 피부로 느껴 위험을 미리 감지함."
            ]
        },
        {
            name: "생체·치유계",
            deities: ["데메테르 (Demeter)", "프레이야 (Freyja)", "페르세포네 (Persephone)", "헤스티아 (Hestia)", "테티스 (Thetis)"],
            abilities: [
                "생체 에너지를 통한 유기물 활성화형 인자",
                "감정 완화 페로몬 및 신체 온기 유도형 인자",
                "동면·치유 주기를 유도하는 신체 조율형 인자",
                "환경 체온 유지 및 신체 안정화형 인자",
                "체온 동결 및 피부 내구성 강화형 인자"
            ],
            features: [
                "식물이나 세포 생체 에너지를 미세하게 촉진시킬 수 있음.",
                "특유의 온기와 체향으로 상대의 인자 과부하 상태를 유일하게 완화시킴.",
                "상대의 극심한 인자 과부하 상태를 일시적으로 동면시키듯 가라앉힘.",
                "차가운 환경에서도 자율 체온을 일정하게 유지하며 주위를 안정시킴.",
                "마찰열이나 과부하 열기를 순식간에 차갑게 식혀버림."
            ]
        },
        {
            name: "지배·환경계",
            deities: ["헤라 (Hera)", "포세이돈 (Poseidon)", "아폴론 (Apollon)", "헬리오스 (Helios)", "에리스 (Eris)", "클리티에 (Clytie)"],
            abilities: [
                "타인의 계급·지배 구조 인지 및 권위 부여형 인자",
                "유체 흐름 및 환경 파동 감응형 인자",
                "생체 바이오리듬 시각화 및 정교한 예지형 인자",
                "시야 내 빛을 흡수 및 반사하는 광학 감각형 인자",
                "상대의 심리적 불안을 유도하는 감각 교란형 인자",
                "특정 대상의 위치를 시각적으로 감지하는 추적형 인자"
            ],
            features: [
                "사내의 미세한 위계 질서와 조직 구조를 직관적으로 파악함.",
                "주변 환경의 기압이나 수분 변화를 피부 감각으로 감지함.",
                "상대의 미세한 체온 및 맥박 변화를 눈으로 스캔하듯 읽어냄.",
                "주변 시각 데이터를 극대화하여 미세한 미동도 놓치지 않음.",
                "집단 내의 미세한 불화나 논리적 허점을 재빠르게 포착함.",
                "특정 대상의 이동 경로나 신체 잔향을 끊임없이 추적함."
            ]
        }
    ];

    function generateData() {
        // 1. 랜덤으로 속성 그룹 선택
        const selectedGroup = groups[Math.floor(Math.random() * groups.length)];

        // 2. 선택된 그룹 내에서 신, 능력, 특징을 각각 랜덤 추출
        const randDeity = selectedGroup.deities[Math.floor(Math.random() * selectedGroup.deities.length)];
        const randAbility = selectedGroup.abilities[Math.floor(Math.random() * selectedGroup.abilities.length)];
        const randFeature = selectedGroup.features[Math.floor(Math.random() * selectedGroup.features.length)];

        // 3. 화면에 출력
        document.getElementById('deity').innerText = randDeity;
        document.getElementById('ability').innerText = randAbility;
        document.getElementById('feature').innerText = randFeature;

        // 그룹 태그 표시
        const tagElem = document.getElementById('group-tag');
        tagElem.innerText = selectedGroup.name;
        tagElem.style.display = 'inline-block';
    }
</script>

</body>
</html>
