<html lang="ko">
<head>

        body {
            background-color: #121212;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-width: 480px;
            width: 100%;
            text-align: center;
            border: 1px solid #333;
        }
        h1 {
            font-size: 1.4rem;
            color: #d1d5db;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
        }
        .result-box {
            background-color: #2a2a2a;
            border-left: 4px solid #f59e0b;
            padding: 20px;
            border-radius: 6px;
            text-align: left;
            margin-bottom: 25px;
            min-height: 160px;
        }
        .label {
            font-size: 0.82rem;
            color: #9ca3af;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .value {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 4px;
        }
        .identity {
            font-size: 0.8rem;
            color: #c084fc;
            font-weight: 600;
            margin-bottom: 14px;
        }
        .tag {
            display: inline-block;
            font-size: 0.75rem;
            background-color: #374151;
            color: #f59e0b;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 6px;
            vertical-align: middle;
        }
        .desc {
            font-size: 0.92rem;
            color: #d1d5db;
            line-height: 1.5;
            margin-bottom: 14px;
        }

        /* 상성 영역 스타일 */
        .affinity-section {
            border-top: 1px dashed #444;
            padding-top: 12px;
            margin-top: 12px;
        }
        .affinity-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 6px;
        }
        .affinity-card {
            background-color: #1a1a1a;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #333;
        }
        .affinity-card.good { border-color: #059669; }
        .affinity-card.bad { border-color: #dc2626; }
        .aff-title {
            font-size: 0.72rem;
            font-weight: bold;
            margin-bottom: 2px;
        }
        .good .aff-title { color: #34d399; }
        .bad .aff-title { color: #f87171; }
        .aff-target {
            font-size: 0.85rem;
            font-weight: bold;
            color: #ffffff;
        }
        .aff-desc {
            font-size: 0.72rem;
            color: #9ca3af;
            margin-top: 2px;
            line-height: 1.2;
        }

        /* 추천 배치 부서 영역 스타일 */
        .dept-section {
            border-top: 1px dashed #444;
            padding-top: 12px;
            margin-top: 12px;
        }

        /* 버튼 그룹 스타일 */
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            flex: 1;
        }
        .btn-main {
            background-color: #f59e0b;
            color: #121212;
        }
        .btn-main:hover {
            background-color: #d97706;
        }
        .btn-copy {
            background-color: #374151;
            color: #e0e0e0;
            border: 1px solid #4b5563;
        }
        .btn-copy:hover {
            background-color: #4b5563;
        }
    </style>
</head>

    <div class="result-box">
        <div class="label">신성인자</div>
        <div class="value">
            <span id="deity">버튼을 눌러 진단하세요</span>
            <span id="group-tag" class="tag" style="display:none;"></span>
        </div>
        <div class="identity" id="identity">-</div>
        
        <div class="label">인자 능력</div>
        <div class="value" id="ability" style="font-size: 0.95rem; font-weight: normal; color: #f3f4f6;">-</div>
        
        <div class="label" style="margin-top: 10px;">주요 특징</div>
        <div class="desc" id="feature">-</div>

        <!-- 인자 상성 리포트 -->
        <div class="affinity-section" id="affinity-box" style="display:none;">
            <div class="label">인자 상성 리포트</div>
            <div class="affinity-grid">
                <div class="affinity-card good">
                    <div class="aff-title">상성 우수 (Good)</div>
                    <div class="aff-target" id="good-target">-</div>
                    <div class="aff-desc" id="good-desc">-</div>
                </div>
                <div class="affinity-card bad">
                    <div class="aff-title">상성 충돌 (Bad)</div>
                    <div class="aff-target" id="bad-target">-</div>
                    <div class="aff-desc" id="bad-desc">-</div>
                </div>
            </div>
        </div>

        <!-- 추천 배치 부서 (상성 리포트 하단 배치) -->
        <div class="dept-section" id="dept-box" style="display:none;">
            <div class="label">추천배치부서</div>
            <div class="value" id="department" style="color: #60a5fa; font-size: 1.05rem;">-</div>
        </div>
    </div>

    <!-- 버튼 영역 -->
    <div class="btn-group">
        <button class="btn-main" onclick="generateData()">인자 측정하기</button>
        <button class="btn-copy" id="copy-btn" onclick="copyResult()">내용복사</button>
    </div>
</div>

    function generateData() {
        const selectedGroup = groups[Math.floor(Math.random() * groups.length)];

        const randDeity = selectedGroup.deities[Math.floor(Math.random() * selectedGroup.deities.length)];
        const randAbility = selectedGroup.abilities[Math.floor(Math.random() * selectedGroup.abilities.length)];
        const randFeature = selectedGroup.features[Math.floor(Math.random() * selectedGroup.features.length)];
        const randDept = selectedGroup.departments[Math.floor(Math.random() * selectedGroup.departments.length)];

        const deityDetail = deityDB[randDeity] || {
            identity: "신성 인자 보유자",
            good: "비너스 계통", goodDesc: "과부하 완화",
            bad: "충돌 계통", badDesc: "파동 오작동"
        };

        document.getElementById('deity').innerText = randDeity;
        document.getElementById('identity').innerText = deityDetail.identity;
        document.getElementById('ability').innerText = randAbility;
        document.getElementById('feature').innerText = randFeature;

        document.getElementById('good-target').innerText = deityDetail.good;
        document.getElementById('good-desc').innerText = deityDetail.goodDesc;
        document.getElementById('bad-target').innerText = deityDetail.bad;
        document.getElementById('bad-desc').innerText = deityDetail.badDesc;

        document.getElementById('department').innerText = randDept;

        const tagElem = document.getElementById('group-tag');
        tagElem.innerText = selectedGroup.name;
        tagElem.style.display = 'inline-block';

        document.getElementById('affinity-box').style.display = 'block';
        document.getElementById('dept-box').style.display = 'block';
    }

    // 클립보드 복사 기능
    function copyResult() {
        const deity = document.getElementById('deity').innerText;
        
        if (deity === "버튼을 눌러 진단하세요") {
            alert("먼저 인자를 진단해 주세요!");
            return;
        }

        const groupTag = document.getElementById('group-tag').innerText;
        const identity = document.getElementById('identity').innerText;
        const ability = document.getElementById('ability').innerText;
        const feature = document.getElementById('feature').innerText;
        const goodTarget = document.getElementById('good-target').innerText;
        const goodDesc = document.getElementById('good-desc').innerText;
        const badTarget = document.getElementById('bad-target').innerText;
        const badDesc = document.getElementById('bad-desc').innerText;
        const department = document.getElementById('department').innerText;

        const textToCopy = `[비너스 그룹 신성인자 진단 결과]
- 신성인자: ${deity} (${groupTag})
- 정체성: ${identity}
- 인자 능력: ${ability}
- 주요 특징: ${feature}

[상성 리포트]
- 상성 우수(Good): ${goodTarget} (${goodDesc})
- 상성 충돌(Bad): ${badTarget} (${badDesc})

[추천배치부서]
${department}`;

        navigator.clipboard.writeText(textToCopy).then(() => {
            const copyBtn = document.getElementById('copy-btn');
            copyBtn.innerText = "복사 완료!";
            setTimeout(() => {
                copyBtn.innerText = "내용복사";
            }, 2000);
        }).catch(err => {
            alert("복사 실패: " + err);
        });
    }
